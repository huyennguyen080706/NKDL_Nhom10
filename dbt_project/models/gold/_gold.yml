version: 2

models:
  # ------------------------------------------------------------------ Dimensions
  - name: dim_ticker
    description: Dimension mã chứng khoán, 1 dòng / mã (trạng thái hiện tại).
    columns:
      - name: ticker_key
        data_tests: [not_null, unique]
      - name: symbol
        data_tests: [not_null, unique]
      - name: financial_template
        data_tests:
          - accepted_values:
              arguments:
                values: [bank, securities, corporate]

  - name: dim_date
    description: Dimension ngày lịch, 1 dòng / ngày. date_key dạng yyyymmdd.
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: full_date
        data_tests: [not_null, unique]

  # ------------------------------------------------------------------ Facts
  - name: fact_price_daily
    description: Fact giá OHLCV, grain ticker_key + date_key. Giá đơn vị nghìn đồng.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ticker_key, date_key]
    columns:
      - name: ticker_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_index_daily
    description: Fact chỉ số thị trường, grain index_code + date_key.
    data_tests:
      - unique_combination:
          arguments:
            columns: [index_code, date_key]
    columns:
      - name: index_code
        data_tests: [not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_financial_metric
    description: >
      Fact chỉ tiêu tài chính, grain mã / kỳ / loại báo cáo / chỉ tiêu. Không có published_at ở nguồn.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ticker_key, period, report_type, metric_id]
    columns:
      - name: financial_metric_key
        data_tests: [not_null, unique]
      - name: ticker_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker_key
      - name: period_end_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: report_type
        data_tests:
          - accepted_values:
              arguments:
                values: [income_statement, balance_sheet, cash_flow]

  # ------------------------------------------------------------------ Marts
  - name: mart_technical_indicators
    description: SMA20/50, RSI14, lợi suất, độ biến động, drawdown. Grain mã / ngày.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - expression_true:
          name: mart_technical_rsi_in_range
          arguments:
            expression: "rsi14 is null or (rsi14 >= 0 and rsi14 <= 100)"
      - expression_true:
          name: mart_technical_drawdown_non_positive
          arguments:
            expression: "drawdown <= 0 and drawdown > -1"
      - expression_true:
          name: mart_technical_sma_within_price_range
          arguments:
            expression: "sma20 is null or sma20 > 0"
    columns:
      - name: ticker_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker_key

  - name: mart_stock_vs_index
    description: Lợi suất cổ phiếu so với VN-Index trên khoảng ngày chung. Grain mã / chỉ số / ngày.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, index_code, trade_date]
      - expression_true:
          name: mart_stock_vs_index_within_common_range
          arguments:
            expression: "trade_date >= common_start_date"
    columns:
      - name: index_close
        data_tests: [not_null]

  - name: mart_financial_summary
    description: Chỉ tiêu tài chính chính theo kỳ, đã xoay ngang để so sánh. Grain mã / kỳ.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, period]
    columns:
      - name: ticker_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker_key
      - name: net_profit_after_tax
        data_tests: [not_null]
      - name: equity
        data_tests: [not_null]

  - name: mart_stock_alerts
    description: Tín hiệu theo quy tắc kèm ngưỡng, giá trị quan sát và giải thích. Grain mã / ngày / quy tắc.
    columns:
      - name: alert_key
        data_tests: [not_null, unique]
      - name: reason
        data_tests: [not_null]
      - name: rule_code
        data_tests:
          - accepted_values:
              arguments:
                values: [GOLDEN_CROSS, DEATH_CROSS, RSI_OVERBOUGHT, RSI_OVERSOLD, VOLUME_SPIKE,
                         LARGE_MOVE_UP, LARGE_MOVE_DOWN, DEEP_DRAWDOWN]
      - name: signal
        data_tests:
          - accepted_values:
              arguments:
                values: [bullish, bearish, neutral]

  - name: mart_pipeline_health
    description: Trạng thái nạp, đối soát, độ mới và chất lượng theo từng bảng Bronze.
    data_tests:
      - expression_true:
          name: pipeline_health_bronze_reconciled
          arguments:
            expression: "is_reconciled"
    columns:
      - name: bronze_table
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [OK, WARN, FAIL]

  # ------------------------------------------------------------------ Marts phân tích (P1)
  - name: mart_return_summary
    description: >
      Lợi suất giá (price return, close chưa xác minh điều chỉnh) theo tháng, 20/60/252 phiên, YTD và toàn kỳ.
      Grain mã / loại kỳ / nhãn kỳ. CAGR chỉ có khi kỳ từ 365 ngày trở lên.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, period_type, period_label]
      - expression_true:
          name: return_summary_finite
          arguments:
            expression: "price_return > -1 and price_return < 20"
      - expression_true:
          name: return_summary_cagr_only_when_long
          arguments:
            expression: "cagr is null or years >= 0.99"
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: period_type
        data_tests:
          - accepted_values:
              arguments:
                values: [MONTH, TRAIL_20D, TRAIL_60D, TRAIL_252D, YTD, ALL]

  - name: mart_risk_metrics
    description: >
      Biến động quy năm (×√252), max drawdown, VaR95 lịch sử một ngày, beta so với VN-Index (chỉ ngày chung)
      và Sharpe (lãi suất phi rủi ro = var risk_free_rate_annual). Grain mã / cửa sổ 60-120-252 phiên.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, window_days]
      - expression_true:
          name: risk_metrics_volatility_non_negative
          arguments:
            expression: "annualized_volatility is null or annualized_volatility >= 0"
      - expression_true:
          name: risk_metrics_drawdown_range
          arguments:
            expression: "max_drawdown <= 0 and max_drawdown > -1"
      - expression_true:
          name: risk_metrics_n_obs_within_window
          arguments:
            expression: "n_obs > 1 and n_obs <= window_days"
      - expression_true:
          name: risk_metrics_beta_has_enough_common_days
          arguments:
            expression: "beta is null or n_obs_beta >= 30"
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: window_days
        data_tests:
          - accepted_values:
              arguments:
                values: [60, 120, 252]
                quote: false

  - name: mart_correlation_pairs
    description: >
      Tương quan Pearson lợi suất ngày theo cặp mã trên các ngày chung trong N phiên gần nhất của thị trường.
      Grain cặp (symbol_a < symbol_b) / cửa sổ. quality_flag = LOW_OBS khi n_obs < 60.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol_a, symbol_b, window_days]
      - expression_true:
          name: correlation_in_range
          arguments:
            expression: "correlation is null or (correlation >= -1.0000001 and correlation <= 1.0000001)"
      - expression_true:
          name: correlation_pair_ordered
          arguments:
            expression: "symbol_a < symbol_b"
      - expression_true:
          name: correlation_n_obs_within_window
          arguments:
            expression: "n_obs <= window_days"
    columns:
      - name: symbol_a
        data_tests: [not_null]
      - name: symbol_b
        data_tests: [not_null]
